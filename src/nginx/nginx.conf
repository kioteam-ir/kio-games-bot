upstream bot {
    server django:8000;
}

server {
    listen 80;
    server_name 127.0.0.1 localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        proxy_pass http://bot;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

        return 301 https://$host$request_uri;
    }

    location /static/ {
        alias /bot/static/;
    }

    location /media/ {
        alias /bot/media/;
    }

}


server {
    listen 443 ssl;
    server_name 194.33.105.77 voice-epi.ir www.voice-epi.ir;

    ssl_certificate /etc/letsencrypt/live/voice-epi.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice-epi.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://bot;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /bot/static/;
    }

    location /media/ {
        alias /bot/media/;
    }
}