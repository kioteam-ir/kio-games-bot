upstream bot {
    server django:8000;
}

server {
    listen 80;
    server_name 127.0.0.1 141.11.187.152;s

    location / {
        proxy_pass http://bot;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /bot/static/;
    }

    location /media/ {
        alias /bot/media/;
    }

}
