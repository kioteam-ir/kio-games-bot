name: Ruff

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ruff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff lint
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: check bot/ api/ tests/ tools/
  format:
    name: ruff format
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check bot/ api/ tests/ tools/