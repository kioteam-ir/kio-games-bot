name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          cd /srv/kio/projects/4fall-bot

          git fetch origin
          git reset --hard origin/master

          docker compose pull
          docker compose up -d --build