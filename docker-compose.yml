services:

  db:
    image: postgres:17.5-alpine3.22
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./src/.env.dev
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    command: ["sh", "-c", "/bot/entrypoint.sh api"]
    expose:
      - 8000
    env_file:
      - ./src/.env.dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - static_volume:/bot/src/static:ro
      - media_volume:/bot/src/media:ro
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    build: .
    command: ["sh", "-c", "/bot/entrypoint.sh bot"]
    volumes:
      - .:/bot
    env_file:
      - ./src/.env.dev
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  backend:
    driver: bridge
