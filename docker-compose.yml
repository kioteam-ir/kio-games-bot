version: '3.8'

services:
  django:
    build: .
    command: ["django"]
    volumes:
      - static_volume:/bot/static
      - media_volume:/bot/media
    expose:
      - 8000
    env_file:
      - ./src/.env.dev
    depends_on:
      - db
  db:
    image: postgres:17.5-alpine3.22
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./src/.env.dev

  nginx:
    build: ./src/nginx
    volumes:
      - static_volume:/data_voice/static
      - media_volume:/data_voice/media
      - ./src/nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - django

  bot:
    build: .
    command: ["bot"]
    volumes:
      - .:/bot
    env_file:
      - ./src/.env.dev
    depends_on:
      - db
      - django

volumes:
  postgres_data:
  static_volume:
  media_volume:


