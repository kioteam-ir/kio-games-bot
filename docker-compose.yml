services:
  redis:
    image: redis:7.4-alpine
    networks:
      - backend
      - central_db_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: ["sh", "-c", "/bot/entrypoint.sh api"]
    expose:
      - 8000
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - central_db_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bot:
    build: .
    command: ["sh", "-c", "/bot/entrypoint.sh bot"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - backend
      - central_db_net

networks:
  backend:
    driver: bridge
  central_db_net:
    external: true
    name: central_db_net
  central_nginx_net:
    external: true
    name: central_nginx_net