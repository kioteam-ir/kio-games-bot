[project]
name = "kio-games-bot"
version = "0.2.0"
description = "Kio Games Telegram bot — aiogram refactor"
authors = [{ name = "mamahoos", email = "m4m4hoos@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiogram[i18n]>=3.22.0",
  "pydantic>=2.12.0,<3.0.0",
  "pydantic-settings>=2.2.1",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.49.0,<1.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "babel>=2.16.0,<3.0.0",
  "redis[hiredis] (>=5.2.0,<6.0.0)",
  "typing-extensions>=4.15.0",
]

[tool.poetry]
package-mode = true
packages = [{ include = "bot" }, { include = "api" }, { include = "tools" }]

[tool.poetry.scripts]
bot = "bot.main:main"
api = "api.main:run"
migrate-all = "tools.migrate_all:main"
migrate-users = "tools.migrate_users:main"
migrate-games = "tools.migrate_games:main"
migrate-scores = "tools.migrate_scores:main"
migrate-sponsors = "tools.migrate_sponsors:main"
migrate-lang-codes = "tools.migrate_lang_codes:main"
migrate-sequences = "tools.migrate_sequences:main"
add-sponsors = "tools.add_sponsors:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
  "ruff>=0.15.1,<0.16.0",
  "poethepoet>=0.41.0,<0.42.0",
  "mypy>=1.18.0,<2.0.0",
  "pytest>=8.2.0,<9.0.0",
  "pytest-asyncio>=0.25.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
]

[tool.poe.tasks]
test = "pytest tests/ -v"
mypy = ["mypy bot/", "mypy api/", "mypy tools/"]
ruff-lint = "ruff check bot/ api/ tests/ tools/"
ruff-format = "ruff format bot/ api/ tests/ tools/"
compile = "pybabel compile -d bot/locales -D bot"
lint = ["ruff-lint", "mypy"]
migrate-users = "python tools/migrate_users.py"
migrate-games = "python tools/migrate_games.py"
migrate-scores = "python tools/migrate_scores.py"
migrate-sponsors = "python tools/migrate_sponsors.py"
migrate-lang-codes = "python tools/migrate_lang_codes.py"
migrate-sequences = "python tools/migrate_sequences.py"
migrate-all = "python tools/migrate_all.py"
add-sponsors = "python tools/add_sponsors.py"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"bot/domain/games/**" = ["SIM105", "SIM110"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
packages = ["bot", "api", "tools"]
exclude = [
  "bot/infrastructure/i18n/texts.py",
  "bot/domain/schemas/texts.py",
]

[[tool.mypy.overrides]]
module = ["bot.domain.games.*"]
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
disable_error_code = ["union-attr", "no-untyped-def"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
