[project]
name = "kio-games-bot"
version = "0.2.0"
description = "Kio Games Telegram bot — aiogram refactor"
authors = [{ name = "mamahoos", email = "m.h.kkouhkan@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiogram[i18n]>=3.22.0",
  "pydantic>=2.12.0,<3.0.0",
  "pydantic-settings>=2.2.1",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "babel>=2.16.0,<3.0.0",
  "typing-extensions>=4.15.0",
]

[tool.poetry]
package-mode = true
packages = [{ include = "bot" }, { include = "api" }]

[tool.poetry.scripts]
bot = "bot.main:main"
api = "api.main:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
  "ruff>=0.15.1,<0.16.0",
  "poethepoet>=0.41.0,<0.42.0",
  "mypy>=1.18.0,<2.0.0",
  "pytest>=8.2.0,<9.0.0",
  "pytest-asyncio>=0.25.0,<1.0.0",
]

[tool.poe.tasks]
test = "pytest tests/ -v"
mypy = ["mypy bot/", "mypy api/"]
ruff-lint = "ruff check bot/ api/ tests/"
ruff-format = "ruff format bot/ api/ tests/"
compile = "pybabel compile -d bot/locales -D bot"
lint = ["ruff-lint", "mypy"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"bot/domain/games/**" = ["SIM105", "SIM110"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
packages = ["bot", "api"]
exclude = [
  "bot/i18n_bootstrap.py",
  "bot/infrastructure/i18n/translator.py",
  "bot/presentation/middlewares/i18n.py",
  "bot/locales/",
]

[[tool.mypy.overrides]]
module = [
    "bot.infrastructure.persistence.django_setup",
    "bot.infrastructure.persistence.user_repository",
    "bot.infrastructure.persistence.game_repository",
    "bot.infrastructure.persistence.sponsor_repository",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped", "import-not-found"]

[[tool.mypy.overrides]]
module = ["bot.domain.games.*"]
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
disable_error_code = ["union-attr", "no-untyped-def"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
